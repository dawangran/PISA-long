name: Build and synthetic tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libbz2-dev liblzma-dev libcurl4-openssl-dev samtools
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Build from source
        run: make -j2
      - name: Run synthetic regression tests
        run: make test PYTHON=python
